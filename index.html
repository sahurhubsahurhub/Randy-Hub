<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Randy Hub V7 Ultimate</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
#notifyContainer{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:10px;z-index:9999}
.notify{background:#111;border-left:4px solid #ff9800;padding:12px 16px;border-radius:8px;opacity:0;transform:translateX(40px);animation:in .3s forwards,out .3s forwards 3s}
@keyframes in{to{opacity:1;transform:translateX(0)}}@keyframes out{to{opacity:0;transform:translateX(40px)}}
.coinFloat{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#ff9800;font-size:24px;font-weight:700;animation:rise .8s forwards}
@keyframes rise{to{opacity:0;transform:translate(-50%,-80%)}}
header{padding:20px;text-align:center;font-size:32px;color:#ff9800}
#autoIndicator{font-size:14px;margin-left:10px;padding:4px 10px;border:1px solid #ff9800;border-radius:10px}
.app{display:grid;grid-template-columns:220px 1fr;height:calc(100vh - 80px)}
.side{background:#111;padding:10px}
.tab{padding:12px;margin:6px 0;background:#222;border-radius:8px;text-align:center;cursor:pointer}
.tab.active{background:#ff9800;color:#000}
.main{padding:14px;overflow:auto}
.page{display:none}.page.active{display:block}
.panel{background:#111;padding:14px;border-radius:10px;margin-bottom:12px}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:#222;padding:8px;border-radius:10px;text-align:center;border:2px solid #333}
.common{border-color:gray}.rare{border-color:deepskyblue}.epic{border-color:violet}.legendary{border-color:gold}
.golden{filter:brightness(1.4)}.rainbow{animation:rb 3s infinite linear}@keyframes rb{to{filter:hue-rotate(360deg)}}
.corrupted{animation:shake .3s infinite}@keyframes shake{50%{transform:translateX(2px)}}
.cosmic{box-shadow:0 0 10px #7f00ff}.void{box-shadow:0 0 10px #00f}.radiant{box-shadow:0 0 10px #ffd700}.greedmut{box-shadow:0 0 10px #0f0}
.btn{padding:10px 14px;background:#ff9800;border:none;border-radius:8px;font-weight:700;margin:4px;cursor:pointer}
.bar{height:16px;background:#222;border-radius:10px;overflow:hidden;margin-top:6px}
.fill{height:100%;width:0;background:#ff9800}
.overlay{display:none;position:fixed;inset:0;background:#000c;z-index:50;align-items:center;justify-content:center;font-size:32px;color:#ff9800}
.modal{display:none;position:fixed;inset:0;z-index:60;align-items:center;justify-content:center}
.box{background:#111;padding:20px;border:2px solid #ff9800;border-radius:10px;width:400px;text-align:center}
</style></head><body>

<header>RANDY HUB V7 <span id="autoIndicator">AUTO: OFF</span></header>

<div class="app">
<div class="side">
<div class="tab active" onclick="page('collection',this)">Collection</div>
<div class="tab" onclick="page('market',this)">Marketplace</div>
<div class="tab" onclick="page('research',this)">Research</div>
<div class="tab" onclick="page('stats',this)">Statistics</div>
<div class="tab" onclick="page('prestige',this)">Prestige</div>
</div>

<div class="main">

<div id="collection" class="page active">
<div class="panel">
Coins: <span id="coins"></span><br>
Videos: <span id="videos"></span><br>
Prestige: <span id="prestige"></span><br>
</div>
<div class="panel">
<button class="btn" onclick="scan()">Scan Web</button>
<div class="bar"><div id="scanFill" class="fill"></div></div>
<button class="btn" onclick="findBuyer()">Find Buyer</button>
<div class="bar"><div id="buyerFill" class="fill"></div></div>
</div>
<div class="panel"><div id="cards" class="cardgrid"></div></div>
</div>

<div id="market" class="page">
<div class="panel"><div id="sales"></div></div>
</div>

<div id="research" class="page">
<div class="panel">
<button class="btn" onclick="up('luck',100)">Luck</button>
<button class="btn" onclick="up('speed',150)">Speed</button>
<button class="btn" onclick="up('gain',250)">Gain</button>
<button class="btn" onclick="up('auto',1000)">Auto</button>
</div>
</div>

<div id="stats" class="page">
<div class="panel">
Scans: <span id="s1"></span><br>
Sales: <span id="s2"></span><br>
Best: <span id="s3"></span><br>
</div>
</div>

<div id="prestige" class="page">
<div class="panel">
Prestige: <span id="prestigeLevel"></span><br>
Shards: <span id="shards"></span>
</div>
<div class="panel" id="prestigeShop"></div>
</div>

</div></div>

<div id="overlay" class="overlay">Scanning...</div>
<div id="modal" class="modal"><div class="box">
<h2 id="buyerName"></h2>
<div id="offerBox"></div>
<button class="btn" onclick="accept()">Accept</button>
<button class="btn" onclick="reroll()">Reroll</button>
<button class="btn" onclick="closeModal()">Close</button>
</div></div>

<div id="notifyContainer"></div>

<script>
function N(m){let d=document.createElement("div");d.className="notify";d.innerHTML=m;notifyContainer.appendChild(d);setTimeout(()=>d.remove(),3500)}
function F(n){let d=document.createElement("div");d.className="coinFloat";d.textContent="+"+n;document.body.appendChild(d);setTimeout(()=>d.remove(),800)}
function page(id,t){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active')}

function DEF(){return{coins:0,prestige:1,luck:0,speed:0,gain:0,auto:0,autoEnabled:false,best:0,scans:0,sales:0,history:[],col:[],shards:0,prestigeShop:{},prestigeTree:{},prestigeMilestones:{}}}
let g;try{g=localStorage.rhv7?JSON.parse(localStorage.rhv7):DEF()}catch(e){g=DEF()}
if(!g.prestigeShop)g.prestigeShop={};if(!g.prestigeTree)g.prestigeTree={};if(!g.prestigeMilestones)g.prestigeMilestones={};

function S(){localStorage.rhv7=JSON.stringify(g)}

const imgs=["https://i.imgur.com/bMEEjcV.png","https://i.imgur.com/fK5dXpV.png","https://i.imgur.com/Ov05PUC.png"];
const buyers=["Collector","Whale","Guru"];

function U(){
coins.textContent=g.coins;
videos.textContent=g.col.length;
prestige.textContent=g.prestige;
s1.textContent=g.scans;
s2.textContent=g.sales;
s3.textContent=g.best;
prestigeLevel.textContent=g.prestige;
shards.textContent=g.shards;
cards.innerHTML="";
g.col.forEach(v=>cards.innerHTML+=`<div class="card ${v.r.toLowerCase()} ${v.m}"><img src="${v.i}" style="width:100%"><br>${v.r}<br>${v.v}</div>`);
prestigeShop.innerHTML=`<button class='btn' onclick="buyPS('gain')">+5% Gain (${g.prestigeShop.gain||0})</button>`;
S()
}

function R(){let b=Math.random()*100;if(b<2)return["Legendary",1500];if(b<10)return["Epic",500];if(b<30)return["Rare",150];return["Common",50]}
function M(){let r=Math.random();if(r<.02)return"golden";if(r<.04)return"rainbow";if(r<.05)return"corrupted";return""}

let scanning=false;
function scan(){if(scanning)return;scanning=true;let p=0;let t=setInterval(()=>{p+=3;scanFill.style.width=p+"%";if(p>=100){clearInterval(t);scanFill.style.width="0%";scanning=false;let[r,v]=R();let m=M();g.col.push({r,v,i:imgs[Math.floor(Math.random()*imgs.length)],m});g.scans++;N("Scanned: "+r);U()}},40)}

let cur=null;
function build(){let i=Math.floor(Math.random()*g.col.length);let v=g.col[i];let o=Math.floor(v.v*(.5+Math.random()*2));cur={i,o};buyerName.textContent=buyers[Math.floor(Math.random()*buyers.length)];offerBox.innerHTML=`Offer: ${o}`}
function findBuyer(){if(!g.col.length)return N("No videos");scanning=true;overlay.style.display="flex";let p=0;let t=setInterval(()=>{p+=3;buyerFill.style.width=p+"%";if(p>=100){clearInterval(t);buyerFill.style.width="0%";overlay.style.display="none";build();modal.style.display="flex"}},40)}
function reroll(){build()}
function accept(){g.coins+=cur.o;g.sales++;g.best=Math.max(g.best,cur.o);g.col.splice(cur.i,1);N("Sold "+cur.o);F(cur.o);closeModal();U()}
function closeModal(){modal.style.display="none";scanning=false}

function up(k,c){if(g.coins<c)return N("Not enough");g.coins-=c;g[k]++;U()}
function buyPS(id){if(g.shards<5)return N("No shards");g.shards-=5;g.prestigeShop[id]=(g.prestigeShop[id]||0)+1;U()}

function autoLoop(){if(g.auto&&g.autoEnabled&&!scanning)scan();setTimeout(autoLoop,2000)}setTimeout(autoLoop,2000)

U()
</script>

</body></html>
